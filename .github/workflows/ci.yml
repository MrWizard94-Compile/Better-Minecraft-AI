name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Unix wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build and verify on Unix
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon --warning-mode fail clean build printBuildEnvironment dependencies

      - name: Build and verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon --warning-mode fail clean build printBuildEnvironment dependencies

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-failure-${{ matrix.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/reports/**
            build/test-results/**
            run/logs/**

  gametest:
    name: Paired P0 GameTests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Make Unix wrapper executable
        run: chmod +x ./gradlew

      - name: Run vanilla-control GameTests
        run: >-
          ./gradlew --no-daemon --warning-mode fail runGameTestServer
          -PbmaiBenchmarkArm=vanilla_control
          -PbmaiObservationEnabled=false
          -PbmaiBenchmarkOutputDir=${{ github.workspace }}/build/p0-benchmark-data

      - name: Retain vanilla-control log
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'run/logs/latest.log') {
            New-Item -ItemType Directory -Force -Path 'build/p0-runtime' | Out-Null
            Copy-Item -LiteralPath 'run/logs/latest.log' -Destination 'build/p0-runtime/gametest-vanilla-control.log'
          }

      - name: Run OBSERVE GameTests
        run: >-
          ./gradlew --no-daemon --warning-mode fail runGameTestServer
          -PbmaiBenchmarkArm=observe
          -PbmaiObservationEnabled=true
          -PbmaiBenchmarkOutputDir=${{ github.workspace }}/build/p0-benchmark-data

      - name: Retain OBSERVE log
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'run/logs/latest.log') {
            New-Item -ItemType Directory -Force -Path 'build/p0-runtime' | Out-Null
            Copy-Item -LiteralPath 'run/logs/latest.log' -Destination 'build/p0-runtime/gametest-observe.log'
          }

      - name: Validate paired benchmark data
        shell: pwsh
        run: |
          ./tools/AnalyzeP0Benchmark.ps1 `
            -ControlCsv 'build/p0-benchmark-data/p0-vanilla_control.csv' `
            -ObserveCsv 'build/p0-benchmark-data/p0-observe.csv' `
            -JsonOutput 'build/p0-evidence/benchmark-summary.json' `
            -MarkdownOutput 'build/p0-evidence/benchmark-summary.md'

      - name: Upload GameTest evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0-gametest-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            build/p0-benchmark-data/**
            build/p0-evidence/**
            build/p0-runtime/**
            run/logs/**

  required-gates:
    name: Required gates
    if: always()
    needs:
      - build
      - gametest
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          GAMETEST_RESULT: ${{ needs.gametest.result }}
        run: |
          printf 'Build matrix: %s\nGameTests: %s\n' "$BUILD_RESULT" "$GAMETEST_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$BUILD_RESULT" = success
          test "$GAMETEST_RESULT" = success
